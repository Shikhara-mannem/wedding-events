<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engagement Invitation | Sri Mitra & Sai Kumar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #3b1c32; /* Deep purple background from the image */
            font-family: 'Cinzel', serif;
            color: #d4af37; /* Base gold text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* For full screen particle effects */
        }

        .invitation-card {
            background-color: #3b1c32;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        /* Mock Floral Garlands - CSS representations since we can't use external images easily */
        .floral-top, .floral-bottom {
            position: absolute;
            left: 0;
            right: 0;
            height: 120px;
            pointer-events: none;
            z-index: 11;
        }
        
        .floral-top {
            top: -40px;
            /* Placeholder for top floral cluster */
            background: radial-gradient(ellipse at top, rgba(247, 92, 130, 0.15) 0%, transparent 60%);
        }

        .floral-bottom {
            bottom: -40px;
            /* Placeholder for bottom floral cluster */
            background: radial-gradient(ellipse at bottom, rgba(247, 92, 130, 0.15) 0%, transparent 60%);
        }

        .header-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2em;
            color: #d4af37; /* Gold */
            margin-bottom: 5px;
            margin-top: 40px; /* Push down past the top floral area */
        }
        
        .sub-header {
            font-size: 0.8em;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: #d4af37;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4em;
            color: #f28b9c; /* Pink script */
            margin: 5px 0;
            line-height: 1;
            text-shadow: 1px 1px 0 #d4af37, -1px -1px 0 #d4af37, 1px -1px 0 #d4af37, -1px 1px 0 #d4af37; /* Gold outline */
        }

        .ampersand {
            font-family: 'Cinzel', serif; /* Use serif for ampersand as in original */
            font-size: 1.5em;
            color: #d4af37; /* Gold */
            margin: 10px 0;
        }

        .event-details {
            font-size: 0.9em;
            line-height: 1.6;
            letter-spacing: 2px;
            margin-top: 40px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 40px; /* Space before interactive buttons */
        }

        .event-details p {
            margin: 8px 0;
        }

        /* Interactive Buttons Section */
        .interactive-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            position: relative;
            z-index: 20; /* Ensure clickable above florals */
        }

        button {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37; /* Gold text */
            padding: 8px 16px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 0.75em;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover {
            background: rgba(212, 175, 55, 0.2);
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* Animations */
        .floating-icon {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 4s ease-in forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="invitation-card" id="cardArea">
        <div class="floral-top"></div>
        
        <div class="header-text">Engagement</div>
        <div class="sub-header">CEREMONY</div>
        
        <h1>Sri Mitra</h1>
        <div class="ampersand">&</div>
        <h1>Sai Kumar</h1>
        
        <div class="event-details">
            <p>MAY 8, 2026</p>
            <p>At 4:30 PM</p>
            <p style="margin-top:15px;">[PLACE HOLDER]</p>
            <p>[VENUE NAME]</p>
            <p>[VENUE LOCATION]</p>
        </div>
        
        <div class="interactive-actions">
            <button onclick="triggerConfetti()"><span>🎉</span> Celebrate</button>
            <button onclick="triggerHearts()"><span>✨</span> Blessings</button>
        </div>
        
        <div class="floral-bottom"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        function triggerConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };
            
            // Get card dimensions to center the pop on the card
            var card = document.getElementById('cardArea');
            var rect = card.getBoundingClientRect();
            var centerX = (rect.left + rect.width / 2) / window.innerWidth;
            var centerY = (rect.top + rect.height / 2) / window.innerHeight;

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              
              // Pop from center of card outwards
              confetti(Object.assign({}, defaults, { 
                  particleCount, 
                  origin: { x: centerX, y: centerY }, 
                  colors: ['#d4af37', '#f28b9c', '#ffffff'] // Gold, Pink, White
              }));
              
            }, 250);
        }

        function triggerHearts() {
            const emojis = [ '✨'];
            var card = document.getElementById('cardArea');
            var rect = card.getBoundingClientRect();
            
            for(let i=0; i<12; i++) {
                setTimeout(() => {
                    const icon = document.createElement('div');
                    icon.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                    icon.classList.add('floating-icon');
                    
                    // Start from the bottom of the card
                    icon.style.left = (rect.left + Math.random() * rect.width) + 'px';
                    icon.style.bottom = (window.innerHeight - rect.bottom) + 'px';
                    icon.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                    document.body.appendChild(icon);
                    
                    setTimeout(() => icon.remove(), 4000);
                }, i * 150);
            }
        }
    </script>

</body>
</html>
