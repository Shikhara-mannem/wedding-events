<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engagement Invitation | Sri Mitra & Sai Kumar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff7e5f, #feb47b, #f75c82); /* Orange to Pink Gradient */
            font-family: 'Cinzel', serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* For full screen particle effects */
        }

        .invitation-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #dfb163; /* Elegant Gold */
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 0 20px rgba(223, 177, 99, 0.2);
            position: relative;
            z-index: 10;
        }

        .header-text {
            font-size: 1.1em;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: #fdfbf7;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5em;
            color: #dfb163; /* Gold */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin: 15px 0;
            line-height: 1.1;
        }

        .ampersand {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5em;
            color: #dfb163;
            margin: -10px 0;
        }

        .gold-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #dfb163, transparent);
            width: 70%;
            margin: 30px auto;
        }

        .venue-details {
            font-size: 1.1em;
            line-height: 1.8;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .venue-details strong {
            color: #dfb163;
            font-weight: 600;
        }

        /* Interactive Buttons Section */
        .interactive-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            border: 1.5px solid #dfb163;
            color: #fdfbf7;
            padding: 12px 25px;
            font-family: 'Cinzel', serif;
            font-size: 1em;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(223, 177, 99, 0.2);
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 15px rgba(223, 177, 99, 0.6);
            transform: translateY(-2px);
        }

        /* Animations */
        .floating-icon {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 4s ease-in forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="header-text">Join us to celebrate the<br>Engagement of</div>
        
        <h1>Sri Mitra</h1>
        <div class="ampersand">&</div>
        <h1>Sai Kumar</h1>
        
        <div class="gold-divider"></div>
        
        <div class="venue-details">
            <p><strong>VENUE</strong><br>[Placeholder: Venue Name]</p>
            <p><strong>LOCATION</strong><br>[Placeholder: Venue Address/Location]</p>
        </div>
        
        <div class="interactive-actions">
            <button onclick="triggerConfetti()"><span>🎉</span> Celebration Pop</button>
            <button onclick="triggerHearts()"><span>✨</span> Send Blessings</button>
        </div>
    </div>

    <!-- Canvas Confetti Library for elegant pops -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        function triggerConfetti() {
            // Elegant gold, orange, and pink confetti
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // since particles fall down, start a bit higher than random
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }, colors: ['#dfb163', '#ff7e5f', '#f75c82', '#ffffff'] }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }, colors: ['#dfb163', '#ff7e5f', '#f75c82', '#ffffff'] }));
            }, 250);
        }

        function triggerHearts() {
            const emojis = ['💖', '✨', '🌸', '💍'];
            for(let i=0; i<8; i++) {
                setTimeout(() => {
                    const icon = document.createElement('div');
                    icon.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                    icon.classList.add('floating-icon');
                    icon.style.left = (Math.random() * 80 + 10) + 'vw';
                    icon.style.bottom = '-20px';
                    icon.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
                    document.body.appendChild(icon);
                    
                    // Clean up DOM after animation
                    setTimeout(() => icon.remove(), 4000);
                }, i * 150);
            }
        }
    </script>

</body>
</html>
